name: Build Bunway
run-name: Build and deliver Bunway 0.4 iPhone, iPad, Watch, widgets and Apple TV

on:
  workflow_dispatch:
    inputs:
      capabilities_ready:
        description: Bunway IDs, App Group, CloudKit Production schema and profiles are ready
        type: boolean
        required: true
        default: false
  push:
    branches: [bunway-release]
    paths:
      - .github/workflows/build_Bunway.yml
      - fastlane/Fastfile
      - fastlane/bunway/**
      - BUNWAY_RELEASE_SETUP.md

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            lane: BunwayPhone
          - platform: tvos
            lane: BunwayTV
    steps:
      - name: Confirm Bunway 0.4 release prerequisites
        env:
          CONFIRMED: ${{ github.event.inputs.capabilities_ready == 'true' || vars.BUNWAY_CAPABILITIES_READY == 'true' }}
        run: |
          if [ "$CONFIRMED" != "true" ]; then
            echo "Confirm BUNWAY_RELEASE_SETUP.md prerequisites and set capabilities_ready or BUNWAY_CAPABILITIES_READY before delivery."
            exit 1
          fi

      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout delivery tools
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Bunway source
        uses: actions/checkout@v5
        with:
          repository: h00l1gvn/bunway-app
          token: ${{ secrets.GH_PAT }}
          path: BunwaySource

      - name: Regenerate Bunway targets
        run: python3 BunwaySource/apple/generate_project.py

      - name: Install delivery dependencies
        run: bundle install

      - name: Validate profile verification logic
        run: ruby fastlane/bunway/test_verify_profiles.rb

      - name: Build and sign Bunway
        run: bundle exec fastlane ${{ matrix.platform }} build_${{ matrix.lane }}
        env: &apple_credentials
          BUNWAY_CAPABILITIES_READY: "true"
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload Bunway to TestFlight
        run: bundle exec fastlane ${{ matrix.platform }} release_${{ matrix.lane }}
        env: *apple_credentials

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Bunway-${{ matrix.lane }}-build
          path: |
            buildlog-bunway-${{ matrix.platform }}
            BunwayPhone.ipa
            BunwayTV.ipa
