name: Build Bunway
run-name: Build and deliver the selected Bunway release platforms

'on':
  workflow_dispatch:
    inputs:
      capabilities_ready:
        description: Bunway IDs, App Group, CloudKit Production schema and profiles are verified
        type: boolean
        required: true
        default: false
      source_sha:
        description: Full reviewed Bunway source commit already merged into main
        type: string
        required: true
      platform:
        description: Deliver only the selected platform to avoid rebuilding processed releases
        type: choice
        required: true
        default: all
        options: [all, ios, tvos]
      readiness_only:
        description: Check existing TV CloudKit and refresh its Store profile without building or uploading
        type: boolean
        required: true
        default: false
      enable_cloudkit:
        description: Enable CloudKit on the existing TV identifier if needed during the readiness probe
        type: boolean
        required: true
        default: false
  push:
    branches: [bunway-release]
    paths:
      - .github/workflows/build_Bunway.yml
      - fastlane/Fastfile
      - fastlane/bunway/**
      - BUNWAY_RELEASE_SETUP.md
      - BUNWAY_STORE_PRIVACY.md

permissions:
  contents: read

concurrency:
  group: bunway-store-delivery
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'h00l1gvn/LoopFollow' && github.ref == 'refs/heads/bunway-release' && (github.event_name == 'workflow_dispatch' || vars.BUNWAY_CAPABILITIES_READY == 'true') && inputs.readiness_only != true
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.platform == 'ios' && '{"include":[{"platform":"ios","lane":"BunwayPhone","ipa":"BunwayPhone.ipa","buildlog":"buildlog-bunway-phone","group_secret":"BUNWAY_PHONE_TESTFLIGHT_GROUP_ID"}]}' || inputs.platform == 'tvos' && '{"include":[{"platform":"tvos","lane":"BunwayTV","ipa":"BunwayTV.ipa","buildlog":"buildlog-bunway-tv","group_secret":"BUNWAY_TV_TESTFLIGHT_GROUP_ID"}]}' || '{"include":[{"platform":"ios","lane":"BunwayPhone","ipa":"BunwayPhone.ipa","buildlog":"buildlog-bunway-phone","group_secret":"BUNWAY_PHONE_TESTFLIGHT_GROUP_ID"},{"platform":"tvos","lane":"BunwayTV","ipa":"BunwayTV.ipa","buildlog":"buildlog-bunway-tv","group_secret":"BUNWAY_TV_TESTFLIGHT_GROUP_ID"}]}') }}
    steps:
      - name: Confirm Bunway release prerequisites without printing credentials
        id: selected
        env:
          CONFIRMED: ${{ (github.event_name == 'workflow_dispatch' && inputs.capabilities_ready == true) || (github.event_name == 'push' && vars.BUNWAY_CAPABILITIES_READY == 'true') }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || vars.BUNWAY_SOURCE_SHA }}
          BUNWAY_ARTIFACT_KEY: ${{ secrets.BUNWAY_ARTIFACT_KEY }}
          BUNWAY_TESTFLIGHT_GROUP_ID: ${{ secrets[matrix.group_secret] }}
        run: |
          python3 - <<'PY'
          import os,re,sys
          if os.environ.get('CONFIRMED') != 'true':
              sys.exit('Verify Bunway IDs, capabilities, Production schema and refreshed profiles before confirming delivery.')
          source=os.environ.get('SOURCE_SHA','')
          if not re.fullmatch(r'[0-9a-fA-F]{40}',source):
              sys.exit('Select a full reviewed Bunway source commit SHA, not a branch name.')
          if not re.fullmatch(r'[0-9a-fA-F]{64}',os.environ.get('BUNWAY_ARTIFACT_KEY','')):
              sys.exit('Configure the independent private 256-bit artifact encryption key before delivery.')
          if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}',os.environ.get('BUNWAY_TESTFLIGHT_GROUP_ID','')):
              sys.exit('Configure the existing internal TestFlight group identifier securely before delivery.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('source_sha='+source.lower()+'\n')
          PY

      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout delivery tools without persisting credentials
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Checkout the reviewed Bunway source commit
        uses: actions/checkout@v5
        with:
          repository: h00l1gvn/bunway-app
          ref: ${{ steps.selected.outputs.source_sha }}
          token: ${{ secrets.GH_PAT }}
          path: BunwaySource
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected source to be merged into Bunway main
        env:
          SOURCE_SHA: ${{ steps.selected.outputs.source_sha }}
        run: git -C BunwaySource merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Regenerate Bunway targets
        run: python3 BunwaySource/apple/generate_project.py

      - name: Install pinned delivery dependencies
        run: bundle install

      - name: Select Node 24 for authenticated artifact encryption
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate profile, artifact encryption and workflow boundaries
        run: |
          ruby fastlane/bunway/test_verify_profiles.rb
          node --test fastlane/bunway/test_artifact_crypto.cjs
          ruby fastlane/bunway/test_store_workflow.rb
          ruby fastlane/bunway/test_testflight_groups.rb
          bundle exec ruby fastlane/bunway/test_package_coordinates.rb

      - name: Build and sign Bunway without printing raw output
        id: store_build
        run: |
          umask 077
          if ! bundle exec fastlane ${{ matrix.platform }} build_${{ matrix.lane }} > "$RUNNER_TEMP/bunway-${{ matrix.platform }}-build.log" 2>&1; then
            echo "Bunway Store build failed. Check capabilities, refreshed profiles and the selected source. Raw output was not printed; encrypted diagnostics will be preserved when available."
            exit 1
          fi
          echo "Bunway Store build completed. Encrypting its private package next."
        env:
          BUNWAY_CAPABILITIES_READY: "true"
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Encrypt the exact Store package
        run: node fastlane/bunway/artifact_crypto.cjs encrypt ${{ matrix.ipa }} ${{ matrix.ipa }}.enc
        env:
          BUNWAY_ARTIFACT_KEY: ${{ secrets.BUNWAY_ARTIFACT_KEY }}

      - name: Preserve only the encrypted Store package
        uses: actions/upload-artifact@v6
        with:
          name: Bunway-${{ matrix.lane }}-encrypted-${{ github.run_id }}
          path: ${{ matrix.ipa }}.enc
          if-no-files-found: error
          retention-days: 7

      - name: Upload Bunway to TestFlight without printing raw output
        id: store_upload
        run: |
          umask 077
          if ! bundle exec fastlane ${{ matrix.platform }} release_${{ matrix.lane }} > "$RUNNER_TEMP/bunway-${{ matrix.platform }}-upload.log" 2>&1; then
            echo "Bunway TestFlight upload failed. Raw output was not printed; encrypted diagnostics will be preserved when available."
            exit 1
          fi
          echo "Bunway upload and processing check completed. Confirm each installed version separately."
        env:
          BUNWAY_CAPABILITIES_READY: "true"
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUNWAY_PHONE_TESTFLIGHT_GROUP_ID: ${{ secrets.BUNWAY_PHONE_TESTFLIGHT_GROUP_ID }}
          BUNWAY_TV_TESTFLIGHT_GROUP_ID: ${{ secrets.BUNWAY_TV_TESTFLIGHT_GROUP_ID }}

      - name: Encrypt failed-run Fastlane and Xcode diagnostics
        id: encrypt_diagnostics
        if: failure() && (steps.store_build.outcome == 'failure' || steps.store_build.outcome == 'success')
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_LOG_DIR: ${{ matrix.buildlog }}
          BUNWAY_ARTIFACT_KEY: ${{ secrets.BUNWAY_ARTIFACT_KEY }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,sys,tarfile
          from pathlib import Path
          try:
              platform=os.environ['PLATFORM']
              expected={'ios':'buildlog-bunway-phone','tvos':'buildlog-bunway-tv'}
              if platform not in expected or os.environ['BUILD_LOG_DIR'] != expected[platform]:
                  sys.exit('The private diagnostic configuration was invalid.')
              temporary=Path(os.environ['RUNNER_TEMP'])
              candidates=[(temporary/f'bunway-{platform}-build.log','fastlane-build.log'),
                          (temporary/f'bunway-{platform}-upload.log','fastlane-upload.log')]
              folder=Path(os.environ['GITHUB_WORKSPACE'])/expected[platform]
              if folder.is_dir() and not folder.is_symlink():
                  candidates.extend((path,'xcode/'+path.name) for path in sorted(folder.glob('*.log')))
              sources=[(path,name) for path,name in candidates if path.is_file() and not path.is_symlink()]
              if sources:
                  target=temporary/f'bunway-{platform}-diagnostics.tar.gz'
                  with tarfile.open(target,'w:gz') as archive:
                      for path,name in sources: archive.add(path,arcname=name,recursive=False)
                  target.chmod(0o600)
          except Exception:
              sys.exit('Private diagnostic collection failed. No raw logs or filenames were printed.')
          PY
          if [ -s "$RUNNER_TEMP/bunway-${{ matrix.platform }}-diagnostics.tar.gz" ]; then
            node fastlane/bunway/artifact_crypto.cjs encrypt "$RUNNER_TEMP/bunway-${{ matrix.platform }}-diagnostics.tar.gz" ${{ matrix.ipa }}.diagnostics.tar.gz.enc
            echo "preserved=true" >> "$GITHUB_OUTPUT"
          else
            echo "The failed run produced no diagnostic logs to preserve."
          fi

      - name: Preserve only encrypted failure diagnostics
        if: failure() && steps.encrypt_diagnostics.outputs.preserved == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Bunway-${{ matrix.lane }}-encrypted-diagnostics-${{ github.run_id }}
          path: ${{ matrix.ipa }}.diagnostics.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

      - name: Remove plaintext packages and private signing/build output
        if: always()
        run: |
          rm -f ${{ matrix.ipa }} "$RUNNER_TEMP/bunway-${{ matrix.platform }}-build.log" "$RUNNER_TEMP/bunway-${{ matrix.platform }}-upload.log" "$RUNNER_TEMP/bunway-${{ matrix.platform }}-diagnostics.tar.gz"
          rm -rf ${{ matrix.buildlog }}

  readiness:
    if: github.repository == 'h00l1gvn/LoopFollow' && github.ref == 'refs/heads/bunway-release' && github.event_name == 'workflow_dispatch' && inputs.readiness_only == true
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed delivery tools without persisting credentials
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install pinned delivery dependencies
        run: bundle install

      - name: Select Node 24 for encrypted diagnostics
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check helper and workflow boundaries without Apple calls
        run: |
          ruby fastlane/bunway/test_tv_readiness.rb
          ruby fastlane/bunway/test_tv_readiness_workflow.rb

      - name: Check diagnostic encryption is configured
        env:
          BUNWAY_ARTIFACT_KEY: ${{ secrets.BUNWAY_ARTIFACT_KEY }}
        run: |
          python3 - <<'PY'
          import os,re,sys
          if not re.fullmatch(r'[0-9a-fA-F]{64}',os.environ.get('BUNWAY_ARTIFACT_KEY','')):
              sys.exit('The private diagnostic encryption key is not configured.')
          PY

      - name: Read TV CloudKit and verify a freshly refreshed Store profile
        id: probe
        env:
          BUNWAY_TV_ENABLE_CLOUDKIT: ${{ inputs.enable_cloudkit && 'true' || 'false' }}
          BUNWAY_TV_READINESS_PROOF: ${{ runner.temp }}/bunway-tv-readiness-proof.json
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          umask 077
          if ! bundle exec fastlane tvos check_BunwayTVReadiness > "$RUNNER_TEMP/bunway-tv-readiness.log" 2>&1; then
            echo "TV readiness failed at capability readback, profile refresh or Production container permission. No archive or upload occurred; encrypted diagnostics will be preserved when possible."
            exit 1
          fi
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          expected={'cloudkit_capability_verified','profile_refreshed','production_profile_verified','exact_container_permission_verified'}
          proof=json.loads(Path(os.environ['BUNWAY_TV_READINESS_PROOF']).read_text())
          if any(proof.get(key) is not True for key in expected) or proof.get('container_association_changed') is not False or proof.get('archive_or_upload_performed') is not False:
              sys.exit('The TV readiness proof was incomplete.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('Verified existing Bunway TV CloudKit capability and a freshly refreshed Store profile granting the exact Bunway container in Production. No container association, archive, upload or device installation was performed.\n')
              output.write('CloudKit capability changed: '+('yes' if proof.get('capability_changed') is True else 'no')+'.\n')
          PY
          echo "TV capability readback and refreshed Production profile verified. App build and device acceptance remain separate."

      - name: Encrypt failed readiness diagnostics
        id: encrypt_diagnostics
        if: failure() && steps.probe.outcome == 'failure'
        env:
          BUNWAY_ARTIFACT_KEY: ${{ secrets.BUNWAY_ARTIFACT_KEY }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,sys,tarfile
          from pathlib import Path
          try:
              temporary=Path(os.environ['RUNNER_TEMP'])
              log=temporary/'bunway-tv-readiness.log'
              if not log.is_file() or log.is_symlink():
                  sys.exit('No private readiness diagnostic log was available.')
              with tarfile.open(temporary/'bunway-tv-readiness-diagnostics.tar.gz','w:gz') as archive:
                  archive.add(log,arcname='readiness.log',recursive=False)
          except Exception:
              sys.exit('Readiness diagnostics could not be prepared; private details were not printed.')
          PY
          node fastlane/bunway/artifact_crypto.cjs encrypt "$RUNNER_TEMP/bunway-tv-readiness-diagnostics.tar.gz" BunwayTV-readiness.diagnostics.tar.gz.enc
          echo "preserved=true" >> "$GITHUB_OUTPUT"

      - name: Preserve only encrypted failed readiness diagnostics
        if: failure() && steps.encrypt_diagnostics.outputs.preserved == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Bunway-TV-readiness-encrypted-${{ github.run_id }}
          path: BunwayTV-readiness.diagnostics.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

      - name: Remove raw readiness diagnostics
        if: always()
        run: rm -f "$RUNNER_TEMP/bunway-tv-readiness.log" "$RUNNER_TEMP/bunway-tv-readiness-proof.json" "$RUNNER_TEMP/bunway-tv-readiness-diagnostics.tar.gz" BunwayTV-readiness.diagnostics.tar.gz.enc
