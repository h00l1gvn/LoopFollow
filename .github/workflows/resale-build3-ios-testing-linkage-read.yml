name: Re$Burrow exact known iOS build3 testing followup
on:
  push:
    branches: [codex/resale-burrow-build3-ios-testing-linkage-read]
    paths: [.github/workflows/resale-build3-ios-testing-linkage-read.yml, Scripts/resale-build3-ios-linkage-read/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resale-burrow-build3-ios-testing-linkage-read
  cancel-in-progress: false
jobs:
  read:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'h00l1gvn/LoopFollow' && github.actor == 'h00l1gvn' && github.ref == 'refs/heads/codex/resale-burrow-build3-ios-testing-linkage-read' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install unchanged pinned JWT verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r Scripts/resale-build3-ios-linkage-read/audit-requirements.txt
      - name: Check exact GET and privacy guards before credentials
        run: |
          python -m unittest discover -s Scripts/resale-build3-ios-linkage-read -p test_read_ios_build3.py
      - name: Read exact owned iOS build3 and existing group once
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/build3-ios-processing-private"
          python Scripts/resale-build3-ios-linkage-read/read_ios_build3.py --execute-read-only --report "$RUNNER_TEMP/build3-ios-processing-private/processing.json" > "$RUNNER_TEMP/build3-ios-processing-private/read-private.log" 2>&1
      - name: Protect minimal read result and diagnostics
        if: always()
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/build3-ios-processing-private" "$RUNNER_TEMP/build3-ios-processing-encrypted"
          tar -czf "$RUNNER_TEMP/build3-ios-processing.tar.gz" -C "$RUNNER_TEMP" build3-ios-processing-private
          node Scripts/resale-build3-ios-linkage-read/protect_resale_artifact.cjs protect "$RUNNER_TEMP/build3-ios-processing.tar.gz" "$RUNNER_TEMP/build3-ios-processing-encrypted/read.gcm" "$RUNNER_TEMP/build3-ios-processing-encrypted/read-envelope.json" Scripts/resale-build3-ios-linkage-read/resale-recipient-public.pem Scripts/resale-build3-ios-linkage-read/scope.json ios "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ReBurrow-build3-ios-testing-linkage-read-${{ github.run_id }}
          path: ${{ runner.temp }}/build3-ios-processing-encrypted/
          if-no-files-found: error
          retention-days: 3
      - name: Clean only private read workspace
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/build3-ios-processing-private" "$RUNNER_TEMP/build3-ios-processing.tar.gz"
