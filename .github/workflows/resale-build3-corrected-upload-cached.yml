name: Re$Burrow build3 exact cached Store upload
on:
  push:
    branches: [codex/resale-burrow-build3-corrected-upload-cached]
    paths: [.github/workflows/resale-build3-corrected-upload-cached.yml, Scripts/resale-build3-corrected/**]
  workflow_dispatch:
    inputs:
      family:
        type: choice
        options: [ios]
        required: true
      package_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: resale-burrow-build3-corrected-upload-${{ inputs.family || 'registration' }}
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'h00l1gvn/LoopFollow' && github.actor == 'h00l1gvn' && github.ref == 'refs/heads/codex/resale-burrow-build3-corrected-upload-cached' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APPROVED_FAMILY: ${{ inputs.family }}
      APPROVED_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reviewed verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r Scripts/resale-build3-corrected/audit-requirements.txt
      - name: Verify focused guards before credentials
        run: |
          python -m unittest discover -s Scripts/resale-build3-corrected/upload -p 'test_build3_upload.py'
      - name: Revalidate exact private cached family and upload once
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          umask 077
          python Scripts/resale-build3-corrected/upload/build3_upload.py --pins "Scripts/resale-build3-corrected/upload/pins-$APPROVED_FAMILY.json" --scope Scripts/resale-build3-corrected/signing-export-scope.json --coordinates Scripts/resale-build3-corrected/export-coordinates.json --work "$RUNNER_TEMP/build3-upload-private" > "$RUNNER_TEMP/build3-upload-wrapper-private.log" 2>&1
      - name: Protect exact upload diagnostics
        if: always()
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/build3-upload-private" "$RUNNER_TEMP/build3-upload-encrypted"
          cp "$RUNNER_TEMP/build3-upload-wrapper-private.log" "$RUNNER_TEMP/build3-upload-private/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/build3-upload.tar.gz" -C "$RUNNER_TEMP" build3-upload-private
          node Scripts/resale-build3-corrected/protect_resale_artifact.cjs protect "$RUNNER_TEMP/build3-upload.tar.gz" "$RUNNER_TEMP/build3-upload-encrypted/upload.gcm" "$RUNNER_TEMP/build3-upload-encrypted/upload-envelope.json" Scripts/resale-build3-corrected/resale-recipient-public.pem Scripts/resale-build3-corrected/signing-export-scope.json "$APPROVED_FAMILY" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ReBurrow-build3-corrected-upload-${{ inputs.family }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build3-upload-encrypted/
          if-no-files-found: error
          retention-days: 3
      - name: Remove private runtime
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/build3-upload-private" "$RUNNER_TEMP/build3-upload.tar.gz" "$RUNNER_TEMP/build3-upload-wrapper-private.log"
