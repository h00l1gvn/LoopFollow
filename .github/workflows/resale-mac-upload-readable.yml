name: ResaleBurrow corrected readable Mac upload ONCE
on:
  push:
    branches: [codex/resale-burrow-mac-upload-readable]
    paths: [.github/workflows/resale-mac-upload-readable.yml]
  workflow_dispatch:
    inputs:
      approved_package_sha256:
        required: true
        type: string
        description: Exact reviewed corrected PKG SHA256 (requires owner approval)
permissions:
  contents: read
concurrency:
  group: resale-burrow-single-readable-Mac-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'h00l1gvn/LoopFollow' && github.actor == 'h00l1gvn' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/resale-burrow-mac-upload-readable' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Pinned dependencies and offline upload guards
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r Scripts/resale/mac-readable-upload/requirements.txt
          python -m unittest discover -s Scripts/resale/mac-readable-upload -p test_upload_corrected_mac.py -v
          python -m unittest discover -s Scripts/resale/mac-readable-upload -p test_validate_corrected_mac.py -v
          python -m unittest discover -s Scripts/resale/mac-readable-upload -p test_resale_export_validation.py -v
          python -m unittest discover -s Scripts/resale/mac-readable-upload -p test_mac_payload_permissions.py -v
          node --test Scripts/resale/mac-readable-upload/test_protect_resale_artifact.cjs
      - name: Exact successful validation, fresh collision GET, distinct journal, ONE upload
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          APPROVED_PACKAGE_SHA256: ${{ inputs.approved_package_sha256 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/readable-upload-log"
          python Scripts/resale/mac-readable-upload/upload_corrected_mac.py --scope Scripts/resale/mac-readable-upload/corrected-package-scope.json --upload-scope Scripts/resale/mac-readable-upload/upload-scope.json --resolution Scripts/resale/mac-readable-upload/reviewed-upload-resolution.json --work-dir "$RUNNER_TEMP/readable-upload-work" > "$RUNNER_TEMP/readable-upload-log/driver.log" 2>&1
      - name: Protect private upload result and diagnostics excluding API key
        if: always()
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/readable-upload-work" "$RUNNER_TEMP/readable-upload-encrypted" "$RUNNER_TEMP/readable-upload-log"
          rm -rf "$RUNNER_TEMP/readable-upload-work/ephemeral-private-keys"
          cp "$RUNNER_TEMP/readable-upload-log/driver.log" "$RUNNER_TEMP/readable-upload-work/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/readable-upload-private.tar.gz" -C "$RUNNER_TEMP" readable-upload-work
          node Scripts/resale/mac-readable-upload/protect_resale_artifact.cjs protect "$RUNNER_TEMP/readable-upload-private.tar.gz" "$RUNNER_TEMP/readable-upload-encrypted/upload.gcm" "$RUNNER_TEMP/readable-upload-encrypted/upload-envelope.json" Scripts/resale/mac-readable-upload/resale-recipient-public.pem Scripts/resale/mac-readable-upload/corrected-package-scope.json macos "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ResaleBurrow-protected-Mac-readable-upload-${{ github.run_id }}
          path: ${{ runner.temp }}/readable-upload-encrypted/
          if-no-files-found: error
          retention-days: 3
      - name: Remove private temporary package logs and key
        if: always()
        run: rm -rf "$RUNNER_TEMP/readable-upload-work" "$RUNNER_TEMP/readable-upload-log" "$RUNNER_TEMP/readable-upload-private.tar.gz"
