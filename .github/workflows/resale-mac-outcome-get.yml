name: ResaleBurrow exact Mac post-rejection outcome (GET only)
on:
  push:
    branches: [codex/resale-burrow-mac-outcome-get]
    paths: [.github/workflows/resale-mac-outcome-get.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resale-burrow-Mac-post-rejection-GET
  cancel-in-progress: false
jobs:
  outcome:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'h00l1gvn/LoopFollow' && github.actor == 'h00l1gvn' && github.ref == 'refs/heads/codex/resale-burrow-mac-outcome-get'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact reviewed helper bytes before credentials
        run: python Scripts/resale/mac-outcome-get/mac_outcome_get.py --verify-source-only
      - name: Install pinned read-only authentication dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r Scripts/resale/mac-outcome-get/upload-requirements.txt
      - name: Offline exact Mac GET and privacy guards
        run: python -m unittest discover -s Scripts/resale/mac-outcome-get -p test_mac_outcome_get.py -v
      - name: GET exact Mac app builds and buildUploads once
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/resale-mac-outcome-private"
          python Scripts/resale/mac-outcome-get/mac_outcome_get.py --output "$RUNNER_TEMP/resale-mac-outcome-private/outcome.json" > "$RUNNER_TEMP/resale-mac-outcome-private/driver.log" 2>&1
      - name: Protect exact private GET snapshot and diagnostics
        if: always()
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/resale-mac-outcome-private" "$RUNNER_TEMP/resale-mac-outcome-encrypted"
          tar -czf "$RUNNER_TEMP/resale-mac-outcome-private.tar.gz" -C "$RUNNER_TEMP" resale-mac-outcome-private
          printf '%s\n' '{"source_sha":"1162d8a1f4fdda1c2678220c9102f9c03ab48c33","recipient_spki_sha256":"62d6dc6cd0253c7d427f63fbadd9953247a6312146df856689955371cd3e6358"}' > "$RUNNER_TEMP/resale-mac-outcome-scope.json"
          node Scripts/resale/mac-outcome-get/protect_resale_artifact.cjs protect "$RUNNER_TEMP/resale-mac-outcome-private.tar.gz" "$RUNNER_TEMP/resale-mac-outcome-encrypted/outcome.gcm" "$RUNNER_TEMP/resale-mac-outcome-encrypted/outcome-envelope.json" Scripts/resale/mac-outcome-get/resale-recipient-public.pem "$RUNNER_TEMP/resale-mac-outcome-scope.json" macos "$GITHUB_RUN_ID"
      - name: Preserve encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ResaleBurrow-protected-Mac-outcome-${{ github.run_id }}
          path: ${{ runner.temp }}/resale-mac-outcome-encrypted/
          if-no-files-found: error
          retention-days: 3
      - name: Remove ephemeral private snapshot
        if: always()
        run: rm -rf "$RUNNER_TEMP/resale-mac-outcome-private" "$RUNNER_TEMP/resale-mac-outcome-private.tar.gz" "$RUNNER_TEMP/resale-mac-outcome-scope.json"
