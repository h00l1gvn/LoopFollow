name: ResaleBurrow protected Bryan ad-hoc signed export (no upload)
on:
  push:
    branches: [codex/resale-burrow-bryan-protected-export]
    paths: [.github/workflows/resale-bryan-protected-export.yml, Scripts/resale/**]
permissions:
  contents: read
concurrency:
  group: resale-burrow-bryan-protected-first-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'h00l1gvn/LoopFollow' && github.ref == 'refs/heads/codex/resale-burrow-bryan-protected-export'
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        family: [ios]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: h00l1gvn/LoopFollow
          ref: 6e6f97a1b18781c7ffc6cf620f15293c29515fc5
          path: delivery-base
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: h00l1gvn/resale-burrow-native
          ref: 1162d8a1f4fdda1c2678220c9102f9c03ab48c33
          token: ${{ secrets.GH_PAT }}
          path: native-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned delivery and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r Scripts/resale/audit-requirements.txt
          cd "$GITHUB_WORKSPACE/delivery-base"
          bundle config set --local path "$RUNNER_TEMP/resale-gems"
          bundle install --jobs 4 --retry 1
          bundle exec ruby -r xcodeproj -e 'abort "Reviewed xcodeproj pin differs." unless Gem.loaded_specs.fetch("xcodeproj").version.to_s == "1.28.1"'
      - name: Verify guards before accessing material
        run: |
          python -m unittest discover -s Scripts/resale -p 'test_resale_export_validation.py' -v
          python -m unittest discover -s Scripts/resale -p 'test_restore_export_guards.py' -v
          python -m unittest discover -s Scripts/resale -p 'test_resale_adhoc_driver.py' -v
          python -m unittest discover -s Scripts/resale -p 'test_validate_resale_adhoc_export.py' -v
          python -m unittest discover -s Scripts/resale -p 'test_validate_adhoc_profiles.py' -v
          python -m unittest discover -s Scripts/resale -p 'test_get_resale_adhoc_profiles.py' -v
          ruby Scripts/resale/test_configure_resale_signing.rb
          node --test Scripts/resale/test_protect_resale_artifact.cjs
      - name: Prepare private runtime scope and ephemeral password
        env:
          MATCH_COMMIT: 4d7f92fe5c81c32823e8ace5aca316ee98c8a53e
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/resale-private" "$RUNNER_TEMP/resale-encrypted"
          python - <<'PY'
          import json, os, pathlib, re, secrets
          commit=os.environ['MATCH_COMMIT']
          if not re.fullmatch(r'[0-9a-f]{40}',commit): raise SystemExit('Reviewed Match commit required.')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'resale-private'
          scope=json.loads(pathlib.Path('Scripts/resale/bryan-direct-signing-export-scope.json').read_text())
          if scope['match_material_commit']!=commit: raise SystemExit('Match commit must match reviewed scope before export.')
          (root/'scope.json').write_text(json.dumps(scope))
          (root/'p12-password').write_text(secrets.token_urlsafe(48))
          PY
      - name: GET-only scoped material restore
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_COMMIT: 4d7f92fe5c81c32823e8ace5aca316ee98c8a53e
          FAMILY: ${{ matrix.family }}
        run: |
          python Scripts/resale/restore_resale_adhoc_material.py --scope "$RUNNER_TEMP/resale-private/scope.json" --delivery-sha "$GITHUB_SHA" --match-commit "$MATCH_COMMIT" --output "$RUNNER_TEMP/resale-private/material" --p12-password-file "$RUNNER_TEMP/resale-private/p12-password" > "$RUNNER_TEMP/resale-private/restore.log" 2>&1
      - name: Manual archive, export and exact-family validation
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python Scripts/resale/export_resale_adhoc.py --scope "$RUNNER_TEMP/resale-private/scope.json" --manifest "$RUNNER_TEMP/resale-private/material/restore-manifest.json" --material-dir "$RUNNER_TEMP/resale-private/material" --source-dir "$GITHUB_WORKSPACE/native-source" --work-dir "$RUNNER_TEMP/resale-private/adhoc-export-work" --p12-password-file "$RUNNER_TEMP/resale-private/p12-password" --bundle-gemfile "$GITHUB_WORKSPACE/delivery-base/Gemfile" > "$RUNNER_TEMP/resale-private/export-driver.log" 2>&1
      - name: Protect archive/export/diagnostics, excluding private keys and material
        if: always()
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/resale-private/adhoc-export-work" "$RUNNER_TEMP/resale-encrypted"
          cp "$RUNNER_TEMP/resale-private/restore.log" "$RUNNER_TEMP/resale-private/adhoc-export-work/" 2>/dev/null || true
          cp "$RUNNER_TEMP/resale-private/export-driver.log" "$RUNNER_TEMP/resale-private/adhoc-export-work/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/resale-export.tar.gz" -C "$RUNNER_TEMP/resale-private" adhoc-export-work
          node Scripts/resale/protect_resale_artifact.cjs protect "$RUNNER_TEMP/resale-export.tar.gz" "$RUNNER_TEMP/resale-encrypted/export.gcm" "$RUNNER_TEMP/resale-encrypted/export-envelope.json" Scripts/resale/resale-recipient-public.pem Scripts/resale/bryan-direct-signing-export-scope.json "$FAMILY" "$GITHUB_RUN_ID"
      - name: Preserve encrypted signed result only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ResaleBurrow-protected-ios-adhoc-${{ github.run_id }}
          path: ${{ runner.temp }}/resale-encrypted/
          if-no-files-found: error
          retention-days: 3
      - name: Clean private source and ephemeral material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/resale-private" "$RUNNER_TEMP/resale-export.tar.gz" "$GITHUB_WORKSPACE/native-source"
