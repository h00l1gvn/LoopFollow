name: Prepare MooByte Devices
run-name: Register MooByte identifiers for every Apple device

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare_MooByteDevices.yml

jobs:
  prepare:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout delivery tools
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install delivery dependencies
        run: bundle install

      - name: Register MooByte bundle identifiers
        run: bundle exec fastlane ios prepare_MooByteDevices
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
